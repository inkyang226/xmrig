name: Build Server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # 🔥 缓存依赖包，下次不用下载
      - name: Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: build-essential cmake git libuv1-dev libssl-dev libhwloc-dev
          version: 1.0

      # 🔥 编译（关闭静态链接，不报错）
      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake .. -DWITH_HWLOC=OFF
          make -j$(nproc)
          mv xmrig server

      # 🔥 输出最终文件
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server
          path: build/server
