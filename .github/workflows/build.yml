name: Build Node
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake libuv1-dev libssl-dev
          mkdir build && cd build
          cmake .. -DWITH_HWLOC=OFF
          make -j$(nproc)
          mv xmrig node

      - uses: actions/upload-artifact@v4
        with:
          name: node
          path: build/node
